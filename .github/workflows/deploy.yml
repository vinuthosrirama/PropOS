name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SHEET_URL: ${{ secrets.VITE_SHEET_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5c76741d68d3c6244f76c866e962e0bb
          # 'openhome-engine' is the CF Pages project bound to propos.addvantage.site
          command: pages deploy dist --project-name=openhome-engine --branch=main
